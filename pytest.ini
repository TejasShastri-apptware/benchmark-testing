[pytest]
addopts = -v --html=e2e-report.html --self-contained-html --tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure
testpaths = tests
# base_url is overridden at runtime by the E2E_BASE_URL env var (see conftest.py).
# Falls back to http://localhost:3000 for local development.
base_url = http://localhost:3000
pythonpath = .
